# Nombre de la aplicacion
spring.application.name=parqueadero-spring

# Conexion a la base de datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/parqueadero_spring
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
# update: actualiza las tablas segun las entidades sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que se ejecutan
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true